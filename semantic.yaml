dataset_id: erp_tasks
application: erp
name: Tareas y Seguimiento de Proyectos
description: "Contiene el registro de tareas, responsables, sedes, fechas de inicio y fin, duraciones y estados de proyectos del ERP."

granularity:
  primary_key:
    - Proyecto
    - Tarea
  description: "Una fila representa una tarea específica asignada a un responsable dentro de un proyecto y sede particular."

entities:
  task: "Tarea"
  project: "Proyecto"
  responsible: "Responsable"
  site: "Fábrica/Sede"

columns:
  Responsable:
    semantic_name: responsible
    type: categorical
    entity: responsible
  Fábrica/Sede:
    semantic_name: site
    type: categorical
    entity: site
  Tarea:
    semantic_name: task_description
    type: categorical
    entity: task
  Estado:
    semantic_name: task_status
    type: categorical
  Inicio:
    semantic_name: start_date
    type: date
  Fin:
    semantic_name: end_date
    type: date
  Duración estimada:
    semantic_name: estimated_duration
    type: text_unit
    unit: days
  Duración real:
    semantic_name: actual_duration
    type: text_unit
    unit: days
  Proyecto:
    semantic_name: project_id
    type: identifier
    entity: project

metrics:
  total_tasks:
    definition: "Cantidad total de tareas en el dataset"
    expression: "COUNT(*)"
  unique_projects:
    definition: "Cantidad total de proyectos distintos"
    expression: 'COUNT(DISTINCT "Proyecto")'
  unique_responsibles:
    definition: "Cantidad total de personas responsables distintas"
    expression: 'COUNT(DISTINCT "Responsable")'

aliases:
  sede: ["fábrica", "fabrica", "planta", "sucursal", "site"]
  responsable: ["empleado", "operario", "encargado", "asignado"]
  proyecto: ["codigo_proyecto", "obra"]
  duracion_real: ["tiempo_real", "cuanto_tardo", "dias_reales"]
  duracion_estimada: ["tiempo_estimado", "estimacion"]
